<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>pawawajsPsych × ChatGPT Experiment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="frame-ancestors https://*.questionpro.eu https://questionpro.com https://www.questionpro.com https://uniofbath.questionpro.eu;">

  <!-- jsPsych core -->
  <script src="../jsPsych/packages/jspsych/dist/index.browser.js"></script>
  <link rel="stylesheet" href="../jsPsych/packages/jspsych/css/jspsych.css" />

  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      height: 100% !important;
      width: 100% !important;
    }
  
    /* 中央寄せの基準ステージ */
    #stage{
      min-height: 100vh !important;
      width: 100% !important;
  
      display: flex !important;
      justify-content: center !important;     /* 横中央 */
      align-items: flex-start !important;     /* ★ 縦は上基準 */
      
      padding-top: 10vh !important;           /* ★ ここが肝：中央やや上 */
      padding-left: 16px !important;
      padding-right: 16px !important;
      box-sizing: border-box !important;
    }
  
    /* jsPsych 本体 */
    #stage #jspsych-content{
      width: min(900px, 100%) !important;
      max-width: 900px !important;
      margin: 0 !important;
      box-sizing: border-box !important;
    }
  </style>
  

  <!-- plugins -->
  <script src="../jsPsych/packages/plugin-preload/dist/index.browser.js"></script>
  <script src="../jsPsych/packages/plugin-html-button-response/dist/index.browser.js"></script>
  <script src="../jsPsych/packages/plugin-html-keyboard-response/dist/index.browser.js"></script>
  <script src="../jsPsych/packages/plugin-survey-likert/dist/index.browser.js"></script>
</head>

<body>
  <div id="stage"></div>
  <script src="./app.js"></script>
</body>
</html>
